[project]
name = "ctx"
version = "0.1.0"
description = "Aggregate and search work context from Slack, Linear, GitHub, Notion, and Obsidian"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "httpx>=0.28.0",
    "tiktoken>=0.9.0",
]

[project.scripts]
ctx = "ctx.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctx"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "prek>=0.3.0",
    "ty>=0.0.14",
    "pytest>=8.0.0",
]

# Ruff configuration - strict defaults
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # Perflint
    "FURB",   # refurb
    "RUF",    # Ruff-specific rules
]
ignore = [
    "ISC001",  # Conflicts with formatter
    "TRY003",  # Long messages in exceptions are fine
    "PLR0913", # Too many arguments - sometimes necessary
    "TC001",   # pydantic needs runtime access to first-party types
    "TC002",   # pydantic needs runtime access to third-party types
    "TC003",   # pydantic needs runtime access to stdlib types
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",     # Unused arguments in tests (fixtures)
    "S101",    # Assert in tests is fine
    "PLR2004", # Magic values in tests are fine
]

[tool.ruff.lint.isort]
known-first-party = ["ctx"]

[tool.ruff.lint.pylint]
max-args = 8

# ty configuration - strict defaults
[tool.ty]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Enable stricter checks - treat warnings as errors
possibly-unresolved-reference = "error"
unknown-argument = "error"
missing-argument = "error"
too-many-positional-arguments = "error"

[tool.ty.terminal]
error-on-warning = true
