# Pre-commit configuration for prek
# Run: prek install && prek run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types: [python]
        priority: 0

      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check --fix
        types: [python]
        priority: 1

      - id: ty
        name: ty type check
        language: system
        entry: uv run ty check
        types: [python]
        pass_filenames: false
        priority: 2
